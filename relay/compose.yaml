services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      RELAY_SECRET: ${RELAY_SECRET:?Set a strong 32+ character secret}
    networks: [relay_internal]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set the HTTPS domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [relay_internal]
    depends_on: [relay]
networks:
  relay_internal: {}
volumes:
  caddy_data: {}
  caddy_config: {}
